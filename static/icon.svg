<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#021a36"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/>
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Subtle tech circuit rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-opacity="0.15" stroke-width="1.5"/>

  <!-- Central Shield Glow & Shape -->
  <path d="M 256,90 L 380,150 L 380,270 C 380,360 256,420 256,420 C 256,420 132,360 132,270 L 132,150 Z" 
        fill="url(#shieldGrad)" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Inner Core Emblem -->
  <path d="M 256,130 L 340,175 L 340,265 C 340,325 256,370 256,370 C 256,370 172,325 172,265 L 172,175 Z" 
        fill="#070a13" fill-opacity="0.8" stroke="#10b981" stroke-width="3" stroke-opacity="0.6"/>

  <!-- Monogram AMS / Terminal Crest -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace" 
        font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">eAMS</text>

  <!-- Subtitle NEXUS -->
  <text x="256" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="8">NEXUS</text>

  <!-- High-tech status pip -->
  <circle cx="256" cy="170" r="8" fill="#10b981" filter="url(#glow)"/>
</svg>
